x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  clickhouse:
    image: ${IMAGE:-clickhouse/clickhouse-server:latest-alpine}
    container_name: clickhouse
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-mydb}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
      VIRTUAL_HOST_MULTIPORTS: |-
        ${WEB_VIRTUAL_HOST}:
          "/":
            port: ${WEB_VIRTUAL_PORT}
        ${API_VIRTUAL_HOST}:
          "/":
            port: ${API_VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - letsencrypt-network
volumes:
  clickhouse-data:
    name: clickhouse-data
  clickhouse-logs:
    name: clickhouse-logs
networks:
  letsencrypt-network:
    external: true
