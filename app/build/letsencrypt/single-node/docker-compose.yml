x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  clickhouse:
    image: ${IMAGE:-clickhouse/clickhouse-server:latest-alpine}
    container_name: clickhouse
    restart: unless-stopped
    logging: *default-logging
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-mydb}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
      VIRTUAL_HOST_MULTIPORTS: |-
        ${WEB_VIRTUAL_HOST}:
          "/":
            port: ${WEB_VIRTUAL_PORT}
        ${API_VIRTUAL_HOST}:
          "/":
            port: ${API_VIRTUAL_PORT}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - clickhouse-coordination:/var/lib/clickhouse/coordination
      - clickhouse-coordination:/var/lib/clickhouse/coordination
    networks:
      - letsencrypt-network
    configs:
      - source: clickhouse-cluster
        target: ${CLICKHOUSE_CLUSTER_CONFIG:-/etc/clickhouse-server/config.d/00-cluster.xml}:ro
      - source: clickhouse-keeper
        target: ${CLICKHOUSE_KEEPER_CONFIG:-/etc/clickhouse-server/config.d/01-keeper.xml}:ro
volumes:
  clickhouse-data:
    name: clickhouse-data
  clickhouse-logs:
    name: clickhouse-logs
  clickhouse-coordination:
    name: clickhouse-coordination
networks:
  letsencrypt-network:
    external: true
configs:
  clickhouse-cluster:
    content: |-
      <clickhouse>
        <remote_servers>
          <${CLICKHOUSE_CLUSTER_NAME:-default}>
            <shard>
              <replica>
                <host>localhost</host>
                <port>9000</port>
              </replica>
            </shard>
          </${CLICKHOUSE_CLUSTER_NAME:-default}>
        </remote_servers>

        <macros>
          <cluster>${CLICKHOUSE_CLUSTER_NAME:-default}</cluster>
          <shard>1</shard>
          <replica>replica-1</replica>
        </macros>
      </clickhouse>
  clickhouse-keeper:
    content: |-
      <clickhouse>
        <keeper_server>
          <tcp_port>9181</tcp_port>
          <server_id>1</server_id>
          <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
          <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
          <coordination_settings>
            <operation_timeout_ms>10000</operation_timeout_ms>
            <session_timeout_ms>30000</session_timeout_ms>
            <raft_logs_level>warning</raft_logs_level>
          </coordination_settings>
          <raft_configuration>
            <server>
              <id>1</id>
              <hostname>localhost</hostname>
              <port>9234</port>
            </server>
          </raft_configuration>
        </keeper_server>

        <zookeeper>
          <node>
            <host>localhost</host>
            <port>9181</port>
          </node>
        </zookeeper>
        <macros>
          <shard>1</shard>
          <replica>replica-1</replica>
        </macros>
      </clickhouse>
